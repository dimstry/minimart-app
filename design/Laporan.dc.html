<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Laporan transaksi</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
.jyp{--bg:#f6f6f7;--card:#ffffff;--fg:#0b0b0d;--muted:#64646d;--mutedbg:#f0f0f2;--border:#e2e2e7;--input:#d4d4db;--primary:#15803d;--pfg:#ffffff;--psoft:#e2f4e7;--psoftfg:#14532d;--danger:#c62828;--dfg:#ffffff;--dsoft:#fdeaea;--dsoftfg:#8a1c1c;--wsoft:#fcefd2;--wsoftfg:#7a3d05;--ring:rgba(21,128,61,.28);--shadow:0 1px 2px rgba(11,11,13,.06);--overlay:rgba(11,11,13,.45);font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased}
.jyp.dark{--bg:#0a0a0c;--card:#141418;--fg:#f4f4f6;--muted:#a3a3ad;--mutedbg:#1f1f25;--border:#2a2a31;--input:#373740;--primary:#22c55e;--pfg:#03200e;--psoft:#0e2c1a;--psoftfg:#8debb0;--danger:#ef5350;--dfg:#1a0404;--dsoft:#3a1515;--dsoftfg:#fca5a5;--wsoft:#38290c;--wsoftfg:#fcd34d;--ring:rgba(34,197,94,.35);--shadow:none;--overlay:rgba(0,0,0,.6)}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.jyp{--bg:#dedee1;--card:rgba(255,255,255,.74);--fg:#111113;--muted:#56565e;--mutedbg:rgba(17,17,19,.05);--border:rgba(255,255,255,.92);--input:rgba(17,17,19,.14);--primary:#18181b;--pfg:#ffffff;--psoft:rgba(17,17,19,.07);--psoftfg:#111113;--danger:#b42318;--dfg:#ffffff;--dsoft:rgba(180,35,24,.11);--dsoftfg:#8a1c12;--wsoft:rgba(181,104,0,.14);--wsoftfg:#6b3a00;--ring:rgba(17,17,19,.12);--shadow:0 12px 40px rgba(17,17,19,.07);--overlay:rgba(210,210,214,.5);background:radial-gradient(1000px 640px at 6% 0%,rgba(255,255,255,.95),transparent 62%),radial-gradient(760px 820px at 104% 36%,rgba(250,250,251,.9),transparent 58%),conic-gradient(from 200deg at 60% 52%,#d3d3d7,#efeff1,#c8c8cc,#f4f4f5,#cdcdd1,#ebebed,#d3d3d7)}
.jyp.dark{--bg:#121214;--card:rgba(34,34,38,.62);--fg:#f4f4f6;--muted:#a9a9b2;--mutedbg:rgba(255,255,255,.06);--border:rgba(255,255,255,.1);--input:rgba(255,255,255,.16);--primary:#f4f4f6;--pfg:#111113;--psoft:rgba(255,255,255,.1);--psoftfg:#f4f4f6;--danger:#f97066;--dfg:#1a0404;--dsoft:rgba(249,112,102,.16);--dsoftfg:#fda29b;--wsoft:rgba(253,176,34,.16);--wsoftfg:#fec84b;--ring:rgba(255,255,255,.18);--shadow:0 12px 40px rgba(0,0,0,.4);--overlay:rgba(0,0,0,.45);background:radial-gradient(1000px 640px at 6% 0%,rgba(80,80,88,.45),transparent 62%),conic-gradient(from 200deg at 60% 52%,#1a1a1d,#2a2a2e,#141416,#303034,#18181b,#26262a,#1a1a1d)}
.jyp [style*="var(--card)"]{-webkit-backdrop-filter:blur(22px) saturate(1.3);backdrop-filter:blur(22px) saturate(1.3)}
.jyp [style*="var(--overlay)"]{-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.jyp main > header{background:transparent!important;border-bottom:0!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;min-height:72px!important;padding-top:12px!important}
.jyp [style*="radius: 12px"],.jyp [style*="radius:12px"]{border-radius:28px!important}
.jyp [style*="radius: 14px"],.jyp [style*="radius: 10px"],.jyp [style*="radius:10px"]{border-radius:20px!important}
.jyp button[style*="radius: 8px"],.jyp a[style*="radius: 8px"],.jyp button[style*="radius:8px"],.jyp button[style*="radius: 10px"],.jyp a[style*="radius: 10px"]{border-radius:999px!important}
.jyp input[style*="radius: 8px"],.jyp select[style*="radius: 8px"],.jyp textarea[style*="radius: 8px"]{border-radius:16px!important}
a{color:#15803d}a:hover{color:#14532d}
</style>
</helmet>
<div class="jyp {{tc}}" style="min-height: 1040px; display: flex; flex-wrap: wrap; align-items: stretch">
<dc-import name="Sidebar" role="Pemilik" user="Joko Yulianto" active="laporan" collapsed="{{false}}" dark="{{dark}}" hint-size="256px,1040px"></dc-import>
<main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
<header style="height: 56px; display: flex; align-items: center; gap: 12px; padding: 0 24px; border-bottom: 1px solid var(--border); background: var(--card)">
<button aria-label="Buka atau tutup sidebar" style="width: 36px; height: 36px; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 8px; background: transparent; color: var(--fg); cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></svg></button>
<span style="width: 1px; height: 20px; background: var(--border)"></span>
<span style="font-size: 14px; color: var(--muted)">Pemilik</span><span style="font-size: 14px; color: var(--muted)">/</span><span style="font-size: 14px; font-weight: 600">Laporan</span>
</header>
<div style="padding: 32px; max-width: 1180px; width: 100%; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 4px"><h1 style="margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.02em">Laporan pembelian &amp; penjualan</h1><p style="margin: 0; font-size: 14px; color: var(--muted)">Rekap transaksi pada rentang tanggal tertentu.</p></div>
<a href="LaporanCetak.dc.html" style="display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border: 1px solid var(--input); border-radius: 8px; background: var(--card); color: var(--fg); font-size: 14px; font-weight: 600; text-decoration: none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 14h12v8H6z"/></svg>Cetak</a>
</div>
<div style="background: var(--card); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); padding: 16px 20px; display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end">
<div role="tablist" aria-label="Jenis laporan" style="display: inline-flex; padding: 3px; border-radius: 10px; background: var(--mutedbg); gap: 2px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="2"><button role="tab" aria-selected="{{t.on}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button></sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="lp-dari" style="font-size: 13px; font-weight: 600">Dari</label><input id="lp-dari" class="mono" value="01/10/2026" style="height: 40px; width: 150px; padding: 0 12px; border: 1px solid var(--input); border-radius: 8px; background: var(--card); color: var(--fg); font-size: 14px"></div>
<span style="height: 40px; display: inline-flex; align-items: center; color: var(--muted)">–</span>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="lp-sampai" style="font-size: 13px; font-weight: 600">Sampai</label><input id="lp-sampai" class="mono" value="24/10/2026" style="height: 40px; width: 150px; padding: 0 12px; border: 1px solid var(--input); border-radius: 8px; background: var(--card); color: var(--fg); font-size: 14px"></div>
<button style="height: 40px; padding: 0 18px; border: 1px solid var(--primary); border-radius: 8px; background: var(--primary); color: var(--pfg); font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer">Tampilkan</button>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px">
<div style="background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; font-weight: 600; color: var(--muted)">Jumlah transaksi</span><strong class="mono" style="font-size: 26px">{{n}}</strong></div>
<div style="background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; font-weight: 600; color: var(--muted)">Total {{kind}}</span><strong class="mono" style="font-size: 26px">{{total}}</strong></div>
</div>
<div style="background: var(--card); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden">
<div style="overflow-x: auto"><div style="min-width: 760px">
<div style="display: grid; grid-template-columns: 56px 180px 180px minmax(180px, 1fr) 170px; align-items: center; height: 44px; padding: 0 12px; border-bottom: 1px solid var(--border); font-size: 13px; font-weight: 600; color: var(--muted)"><span style="padding: 0 8px">No</span><span style="padding: 0 8px">Kode</span><span style="padding: 0 8px">Tanggal</span><span style="padding: 0 8px">{{who}}</span><span style="padding: 0 8px; text-align: right">Total</span></div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
<div style="display: grid; grid-template-columns: 56px 180px 180px minmax(180px, 1fr) 170px; align-items: center; min-height: 50px; padding: 0 12px; border-bottom: 1px solid var(--border); font-size: 14px">
<span class="mono" style="padding: 0 8px; color: var(--muted)">{{r.no}}</span><span class="mono" style="padding: 0 8px; font-weight: 600">{{r.kode}}</span><span class="mono" style="padding: 0 8px; color: var(--muted)">{{r.tgl}}</span><span style="padding: 0 8px">{{r.who}}</span><span class="mono" style="padding: 0 8px; text-align: right; font-weight: 600">{{r.total}}</span>
</div>
</sc-for>
<div style="display: grid; grid-template-columns: 56px 180px 180px minmax(180px, 1fr) 170px; align-items: center; min-height: 56px; padding: 0 12px; background: var(--mutedbg); font-size: 14px; font-weight: 800"><span style="padding: 0 8px; grid-column: span 4">TOTAL</span><span class="mono" style="padding: 0 8px; text-align: right">{{total}}</span></div>
</div></div>
</div>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"$preview":{"width":1440,"height":1040}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? true;
    const tab = (this.state && this.state.tab) || 'jual';
    const rp = (n) => 'Rp ' + Number(n).toLocaleString('id-ID');
    const jual = [
      ['PJ-261024-0012', '24/10 14:05', 'Asep Saepudin', 52500],
      ['PJ-261024-0011', '24/10 13:41', 'Asep Saepudin', 118000],
      ['PJ-261024-0010', '24/10 12:18', 'Dewi Lestari', 23500],
      ['PJ-261023-0021', '23/10 19:52', 'Dewi Lestari', 76000],
      ['PJ-261023-0020', '23/10 18:30', 'Dewi Lestari', 145500],
      ['PJ-261022-0018', '22/10 16:47', 'Asep Saepudin', 214500],
      ['PJ-261021-0009', '21/10 10:16', 'Asep Saepudin', 41000],
      ['PJ-261020-0004', '20/10 08:12', 'Dewi Lestari', 16000]
    ];
    const beli = [
      ['BL-261024-004', '24/10 13:20', 'CV Sinar Pangan Abadi', 465000],
      ['BL-261024-003', '24/10 11:05', 'Toko Grosir Berkah Jaya', 2197600],
      ['BL-261024-002', '24/10 09:40', 'UD Tani Makmur', 780000],
      ['BL-261024-001', '24/10 08:15', 'CV Sumber Rejeki', 1245000],
      ['BL-261017-002', '17/10 10:02', 'UD Sari Tirta', 612000],
      ['BL-261010-001', '10/10 09:30', 'PT Cahaya Distribusi Nusantara', 3420000]
    ];
    const src = tab === 'jual' ? jual : beli;
    let t = 0;
    const rows = src.map((x, i) => { t += x[3]; return { no: i + 1, kode: x[0], tgl: x[1], who: x[2], total: rp(x[3]) }; });
    const mk = (k, label) => ({
      label: label, on: tab === k ? 'true' : 'false', pick: () => this.setState({ tab: k }),
      style: 'height:34px;padding:0 14px;border:0;border-radius:8px;font-family:inherit;font-size:13px;cursor:pointer;color:var(--fg);' + (tab === k ? 'background:var(--card);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.12);' : 'background:transparent;font-weight:500;')
    });
    return {
      dark: dark, tc: dark ? 'dark' : '', tabs: [mk('jual', 'Penjualan'), mk('beli', 'Pembelian')],
      rows: rows, n: rows.length, total: rp(t),
      kind: tab === 'jual' ? 'penjualan' : 'pembelian', who: tab === 'jual' ? 'Kasir' : 'Supplier'
    };
  }
}
</script>
</body>
</html>
